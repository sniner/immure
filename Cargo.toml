[package]
name = "immure"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Stefan Schönberger <stefan@sniner.dev>"]
license = "Apache-2.0"
description = "Content-addressed file storage: entries are named by the hash of their content, sharded, immutable, optionally zstd-compressed and encrypted"
repository = "https://github.com/sniner/immure"
homepage = "https://github.com/sniner/immure"
keywords = ["content-addressed", "storage", "cas", "deduplication", "hash"]
categories = ["filesystem", "data-structures"]
readme = "README.md"

[features]
default = ["zstd"]
# Transparent zstd compression of entries. Pulls in the zstd C library, which is
# why it can be turned off; a store built without it refuses to compress rather
# than silently storing plain bytes.
zstd = ["dep:zstd"]
# Serialise `Digest`, `Algorithm` and `Status` — for config files and for
# databases that keep digests as their record ids.
serde = ["dep:serde"]
# Transparent encryption of entries, and `crypt::seal`/`crypt::open` for blobs
# that never reach a store. Implies `zstd`: compress first, then seal, because
# the other order compresses ciphertext and gains nothing.
# `getrandom` is for the nonce every blob is sealed under.
crypt = ["dep:chacha20poly1305", "dep:getrandom", "dep:zeroize", "zstd"]

[dependencies]
blake3 = "1.8.5"
chacha20poly1305 = { version = "0.11.0", optional = true, default-features = false, features = [
    "alloc",
    "zeroize",
] }
getrandom = { version = "0.4.3", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
sha2 = "0.11.0"
thiserror = "2.0.19"
tracing = "0.1.44"
zeroize = { version = "1.9.0", optional = true }
zstd = { version = "0.13.3", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
